services:
  redis:
    image: redis:7-alpine
    container_name: prototipo_dayc_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  db:
    image: postgres:16
    container_name: prototipo_dayc_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prototipo_dayc}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - prototipo_dayc_data:/var/lib/postgresql/data

  toxiproxy:
    image: shopify/toxiproxy:2.1.4
    container_name: prototipo_dayc_toxiproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:8474:8474"
    expose:
      - "8474"
      - "8666"

volumes:
  prototipo_dayc_data:
